<!DOCTYPE html>
<html>

<head>
    <title>IoT Dashboard Login</title>
</head>

<body
    style="font-family:Arial;background:#0f172a;color:white;display:flex;align-items:center;justify-content:center;height:100vh;">

    <form method="POST" style="background:#1e293b;padding:30px;border-radius:15px;width:320px;">
        <h2>⚡ IoT Dashboard Login</h2>

        <label>Username</label><br>
        <input name="username" style="width:100%;padding:10px;margin:8px 0;"><br>

        <label>Password</label><br>
        <input name="password" type="password" style="width:100%;padding:10px;margin:8px 0;"><br>

        <button
            style="width:100%;padding:10px;margin-top:15px;background:#22c55e;color:white;border:none;border-radius:8px;">
            Login
        </button>

        <p style="font-size:12px;color:#94a3b8;margin-top:15px;">
            Demo login: admin / admin123
        </p>
    </form>

</body>

</html>
