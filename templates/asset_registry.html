<!DOCTYPE html>
<html>
<head>
    <title>Asset Registry</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f4f6f8; }
        .top-bar { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .form-box { background: white; padding: 15px; border-radius: 8px; }
        input, select { padding: 8px; margin: 5px; }
        button, a { padding: 8px 12px; border: none; border-radius: 5px; text-decoration: none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; }
        th { background: #111827; color: white; }
        .save-btn { background: #2563eb; color: white; }
        .back-btn { background: #374151; color: white; }
        .edit-btn { background: #f59e0b; color: white; }
        .delete-btn { background: #dc2626; color: white; }
        .active { color: green; font-weight: bold; }
        .inactive { color: red; font-weight: bold; }
    </style>
</head>
<body>

<div class="top-bar">
    <h2>Asset Registry</h2>
    <a href="/" class="back-btn">Back to Dashboard</a>
</div>

<div class="form-box">
    <input type="hidden" id="assetId">

    <select id="siteSelect"></select>

    <input id="assetName" placeholder="Asset Name">

    <select id="assetType">
        <option value="AC METER">AC METER</option>
        <option value="Smoke Sensor">Smoke Sensor</option>
        <option value="Fuel Sensor">Fuel Sensor</option>
        <option value="Transformer">Transformer</option>
        <option value="Generator">Generator</option>
    </select>

    <label>
        <input type="checkbox" id="isActive" checked>
        Active
    </label>

    <button class="save-btn" onclick="saveAsset()">Save Asset</button>
</div>

<table>
    <thead>
        <tr>
            <th>Asset ID</th>
            <th>Site</th>
            <th>Asset Name</th>
            <th>Asset Type</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="assetTableBody"></tbody>
</table>

<script>
let sites = [];

async function loadSites() {
    const res = await fetch("/sites_registry");
    sites = await res.json();

    const select = document.getElementById("siteSelect");
    select.innerHTML = "";

    sites.forEach(s => {
        select.innerHTML += `<option value="${s.site_id}">${s.site_name}</option>`;
    });
}

async function loadAssets() {
    const res = await fetch("/assets_registry_full");
    const assets = await res.json();

    const tbody = document.getElementById("assetTableBody");
    tbody.innerHTML = "";

    assets.forEach(a => {
        tbody.innerHTML += `
            <tr>
                <td>${a.asset_id}</td>
                <td>${a.site}</td>
                <td>${a.asset_name}</td>
                <td>${a.asset_type}</td>
                <td class="${a.is_active ? 'active' : 'inactive'}">
                    ${a.is_active ? "Active" : "Inactive"}
                </td>
                <td>
                    <button class="edit-btn" onclick='editAsset(${JSON.stringify(a)})'>Edit</button>
                    <button class="delete-btn" onclick="deactivateAsset(${a.asset_id})">Deactivate</button>
                </td>
            </tr>
        `;
    });
}

async function saveAsset() {
    const id = document.getElementById("assetId").value;

    const payload = {
        site_id: Number(document.getElementById("siteSelect").value),
        asset_name: document.getElementById("assetName").value,
        asset_type: document.getElementById("assetType").value
    };

    const url = id ? `/assets_registry/${id}` : "/assets_registry";
    const method = id ? "PUT" : "POST";

    await fetch(url, {
        method,
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
    });

    clearForm();
    loadAssets();
}

function editAsset(a) {
    document.getElementById("assetId").value = a.asset_id;
    document.getElementById("assetName").value = a.asset_name;
    document.getElementById("assetType").value = a.asset_type;

    const site = sites.find(s => s.site_name === a.site);
    if (site) {
        document.getElementById("siteSelect").value = site.site_id;
    }
}

async function deactivateAsset(id) {
    if (!confirm("Deactivate this asset?")) return;

    await fetch(`/assets_registry/${id}`, {
        method: "DELETE"
    });

    loadAssets();
}

function clearForm() {
    document.getElementById("assetId").value = "";
    document.getElementById("assetName").value = "";
    document.getElementById("isActive").checked = true;
}

async function init() {
    await loadSites();
    await loadAssets();
}

init();
</script>

</body>
</html>
