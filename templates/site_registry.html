<!DOCTYPE html>
<html>
<head>
    <title>Site Registry</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f4f6f8; }
        .top-bar { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .form-box { background: white; padding: 15px; border-radius: 8px; }
        input { padding: 8px; margin: 5px; }
        button, a { padding: 8px 12px; border: none; border-radius: 5px; text-decoration: none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; }
        th { background: #111827; color: white; }
        .save-btn { background: #2563eb; color: white; }
        .back-btn { background: #374151; color: white; }
        .edit-btn { background: #f59e0b; color: white; }
        .delete-btn { background: #dc2626; color: white; }
    </style>
</head>
<body>

<div class="top-bar">
    <h2>Site Registry</h2>
    <a href="/" class="back-btn">Back to Dashboard</a>
</div>

<div class="form-box">
    <input type="hidden" id="siteId">
    <input id="siteName" placeholder="Site Name">
    <button class="save-btn" onclick="saveSite()">Save Site</button>
</div>

<table>
    <thead>
        <tr>
            <th>Site ID</th>
            <th>Site Name</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="siteTableBody"></tbody>
</table>

<script>
async function loadSites() {
    const res = await fetch("/sites_registry");
    const sites = await res.json();

    const tbody = document.getElementById("siteTableBody");
    tbody.innerHTML = "";

    sites.forEach(s => {
        tbody.innerHTML += `
            <tr>
                <td>${s.site_id}</td>
                <td>${s.site_name}</td>
                <td>
                    <button class="edit-btn" onclick='editSite(${JSON.stringify(s)})'>Edit</button>
                    <button class="delete-btn" onclick="deleteSite(${s.site_id})">Delete</button>
                </td>
            </tr>
        `;
    });
}

async function saveSite() {
    const id = document.getElementById("siteId").value;
    const site_name = document.getElementById("siteName").value;

    if (!site_name) {
        alert("Site name is required");
        return;
    }

    const url = id ? `/sites_registry/${id}` : "/sites_registry";
    const method = id ? "PUT" : "POST";

    await fetch(url, {
        method,
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ site_name })
    });

    clearForm();
    loadSites();
}

function editSite(s) {
    document.getElementById("siteId").value = s.site_id;
    document.getElementById("siteName").value = s.site_name;
}

async function deleteSite(id) {
    if (!confirm("Delete this site?")) return;

    await fetch(`/sites_registry/${id}`, {
        method: "DELETE"
    });

    loadSites();
}

function clearForm() {
    document.getElementById("siteId").value = "";
    document.getElementById("siteName").value = "";
}

loadSites();
</script>

</body>
</html>
